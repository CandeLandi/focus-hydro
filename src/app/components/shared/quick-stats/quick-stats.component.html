<div class="mb-3 sm:mb-[18px] lg:mb-[14px]">
  <h4 class="mb-2.5 sm:mb-3 lg:mb-2 text-[12px] sm:text-[14px] lg:text-[11px] font-bold uppercase tracking-[0.08em] text-[rgba(210,220,245,0.68)]">{{ 'stats.title' | translate }}</h4>
  <div class="grid grid-cols-3 items-stretch overflow-hidden rounded-[14px] sm:rounded-[18px] lg:rounded-[14px] border border-[rgba(106,146,235,0.16)] bg-[linear-gradient(180deg,rgba(15,26,49,0.62)_0%,rgba(10,19,37,0.78)_100%)]">
    @for (stat of stats; track $index; let i = $index) {
      <div class="relative flex min-h-[68px] sm:min-h-[76px] lg:min-h-[56px] flex-1 flex-col items-center justify-center px-2.5 sm:px-3 lg:px-2 py-[0.62rem] sm:py-[0.8rem] lg:py-[0.5rem]">
        @if (i > 0 && $index < 3) {
          <span class="pointer-events-none absolute bottom-[18%] left-0 top-[18%] w-px bg-[rgba(133,163,222,0.2)] max-[459px]:hidden"></span>
        }
        <div
          class="text-[1.72rem] sm:text-[2rem] lg:text-[1.48rem] font-bold leading-none tracking-[-0.03em] text-[rgba(241,245,249,0.95)]"
          [class.text-[#49e6ff]]="isHighlight(stat)"
        >
          {{ stat.value }}
        </div>
        <div class="mt-[0.3rem] sm:mt-[0.35rem] lg:mt-[0.22rem] text-center text-[0.66rem] sm:text-[0.72rem] lg:text-[0.6rem] uppercase tracking-[0.06em] text-[rgba(180,197,228,0.74)]">
          {{ stat.label }}
        </div>
      </div>
    }
  </div>
</div>

<div class="bottle-wrapper relative w-full max-h-full shrink-0">
  <!-- Halos detrás de la botella -->
  <div class="halo-container">
    <div class="halo halo-diffuse halo-breath"></div>
    <div class="halo halo-bright halo-breath"></div>
    <!-- Brillos orbitales (segmentos de luz finos) -->
    <div class="halo-orbital halo-orbital-1" aria-hidden="true"></div>
    <div class="halo-orbital halo-orbital-2" aria-hidden="true"></div>
    <div class="halo-orbital halo-orbital-3" aria-hidden="true"></div>
  </div>
  <!-- Progress ring around bottle -->
  <svg viewBox="0 0 200 320" class="bottle-ring-svg" xmlns="http://www.w3.org/2000/svg">
    <circle cx="100" cy="197" r="92" fill="none" class="ring-track" />
    <circle cx="100" cy="197" r="92" fill="none" stroke="url(#ringGradient)" stroke-width="2.5" stroke-linecap="round"
      [attr.stroke-dasharray]="ringCircumference"
      [attr.stroke-dashoffset]="ringOffset()"
      class="ring-progress transition-all duration-700 ease-out" />
    <defs>
      <linearGradient id="ringGradient" x1="0%" y1="0%" x2="100%" y2="0%">
        <stop offset="0%" stop-color="#3be8ff" />
        <stop offset="50%" stop-color="#22d3ee" />
        <stop offset="100%" stop-color="#06b6d4" />
      </linearGradient>
    </defs>
  </svg>
  <!-- Bottle -->
  <svg viewBox="0 0 200 320" class="bottle-svg" xmlns="http://www.w3.org/2000/svg">
    <defs>
      <linearGradient id="waterGradient" x1="0%" y1="0%" x2="0%" y2="100%">
        <stop offset="0%" stop-color="#58F1FF" stop-opacity="0.78" />
        <stop offset="45%" stop-color="#1CD4FF" stop-opacity="0.68" />
        <stop offset="100%" stop-color="#0D88D9" stop-opacity="0.56" />
      </linearGradient>
      <radialGradient id="bubbleGradient">
        <stop offset="0%" stop-color="white" stop-opacity="0.7" />
        <stop offset="70%" stop-color="#a5f3fc" stop-opacity="0.35" />
        <stop offset="100%" stop-color="#06b6d4" stop-opacity="0.08" />
      </radialGradient>
      <clipPath id="bottleClip">
        <rect x="49" y="94" width="102" height="207" rx="16" />
      </clipPath>
      <filter id="bottleGlow" x="-20%" y="-20%" width="140%" height="140%">
        <feGaussianBlur stdDeviation="2" result="blur" />
        <feOffset in="blur" dx="0" dy="0" result="offsetBlur" />
        <feFlood flood-color="#4ce8ff" flood-opacity="0.4" result="color" />
        <feComposite in="color" in2="offsetBlur" operator="in" result="glow" />
        <feMerge>
          <feMergeNode in="glow" />
          <feMergeNode in="SourceGraphic" />
        </feMerge>
      </filter>
      <filter id="waterGlow" x="-10%" y="-10%" width="120%" height="120%">
        <feGaussianBlur stdDeviation="3" result="blur" />
        <feFlood flood-color="#37e0ff" flood-opacity="0.22" result="color" />
        <feComposite in="color" in2="blur" operator="in" result="glow" />
        <feMerge>
          <feMergeNode in="glow" />
          <feMergeNode in="SourceGraphic" />
        </feMerge>
      </filter>
    </defs>

    <!-- Bottle Cap -->
    <rect x="70" y="10" width="60" height="25" rx="8" fill="#22d3ee" stroke="#4ce8ff" stroke-width="2" />
    <rect x="65" y="30" width="70" height="20" rx="5" fill="#0891b2" stroke="#22d3ee" stroke-width="2" />

    <!-- Bottle Neck -->
    <path
      d="M 75 50 L 70 70 L 70 85 Q 70 90 75 90 L 125 90 Q 130 90 130 85 L 130 70 L 125 50 Z"
      fill="#0f172a"
      stroke="#4ce8ff"
      stroke-width="3"
      filter="url(#bottleGlow)"
    />

    <!-- Main Bottle Body - Glass with subtle fill -->
    <rect
      x="45"
      y="90"
      width="110"
      height="215"
      rx="20"
      fill="rgba(110, 235, 255, 0.05)"
      stroke="#4ce8ff"
      stroke-width="3"
      filter="url(#bottleGlow)"
    />

    <!-- Water inside bottle -->
    <g clip-path="url(#bottleClip)" filter="url(#waterGlow)">
      <rect
        x="49"
        [attr.y]="waterY()"
        width="102"
        [attr.height]="waterHeight()"
        fill="url(#waterGradient)"
        class="water-fill transition-all duration-1000 ease-out"
      />
      <!-- Surface wave (organic curve) -->
      @if (shouldShowWaves()) {
        <path
          [attr.d]="waterSurfacePath()"
          fill="url(#waterGradient)"
          opacity="0.9"
          class="water-surface"
        />
      }

      <!-- Bubbles: 3px, 5px, 7px with bubbleRise -->
      @if (shouldShowBubbles()) {
        <circle cx="72" [attr.cy]="waterY() + waterHeight() * 0.25" r="3" fill="url(#bubbleGradient)" class="bubble bubble-1" />
        <circle cx="115" [attr.cy]="waterY() + waterHeight() * 0.4" r="5" fill="url(#bubbleGradient)" class="bubble bubble-2" />
        <circle cx="88" [attr.cy]="waterY() + waterHeight() * 0.6" r="3.5" fill="url(#bubbleGradient)" class="bubble bubble-3" />
        @if (shouldShowMoreBubbles()) {
          <circle cx="105" [attr.cy]="waterY() + waterHeight() * 0.75" r="7" fill="url(#bubbleGradient)" class="bubble bubble-4" />
          <circle cx="78" [attr.cy]="waterY() + waterHeight() * 0.88" r="4" fill="url(#bubbleGradient)" class="bubble bubble-5" />
        }
      }
    </g>

    <!-- Glass reflections -->
    <ellipse cx="68" cy="165" rx="14" ry="55" fill="rgba(255,255,255,0.12)" class="glass-reflection" />
    <ellipse cx="132" cy="218" rx="10" ry="28" fill="rgba(255,255,255,0.1)" class="glass-reflection" />
    <circle cx="125" cy="120" r="4" fill="rgba(255,255,255,0.25)" class="glass-reflection" />

    <!-- Inner outline for depth -->
    <rect
      x="45"
      y="90"
      width="110"
      height="215"
      rx="20"
      fill="none"
      stroke="rgba(76, 232, 255, 0.4)"
      stroke-width="1"
    />

    <!-- Water level marks (optional, subtle) -->
    @for (level of [25, 50, 75]; track level) {
      <line
        x1="38"
        [attr.y1]="94 + (207 * (100 - level)) / 100"
        x2="48"
        [attr.y2]="94 + (207 * (100 - level)) / 100"
        stroke="rgba(76, 232, 255, 0.35)"
        stroke-width="1.5"
      />
      <line
        x1="152"
        [attr.y1]="94 + (207 * (100 - level)) / 100"
        x2="162"
        [attr.y2]="94 + (207 * (100 - level)) / 100"
        stroke="rgba(76, 232, 255, 0.35)"
        stroke-width="1.5"
      />
    }
  </svg>
</div>

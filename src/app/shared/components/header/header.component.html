<header class="focusflow-header">
  <div class="focusflow-header-inner">
    <div class="focusflow-brand">
      <div class="focusflow-logo-frame">
        <img
          src="/images/logo-hydrofocus.png"
          alt="FocusFlow logo"
          class="focusflow-logo"
        />
      </div>
      <div class="focusflow-brand-copy">
        <h1>Focus<span>Flow</span></h1>
        <p>{{ 'header.tagline' | translate }}</p>
      </div>
    </div>

    <div class="focusflow-live">
      <span class="focusflow-live-dot"></span>
      <span>{{ 'header.session' | translate:{ value: sessionNumber() } }}</span>
      <span class="focusflow-live-separator">·</span>
      <span>{{ 'header.todayFocus' | translate:{ value: focusTimeLabel() } }}</span>
    </div>

    <div class="focusflow-header-actions">
      <button
        type="button"
        class="focusflow-ambient-btn"
        [class.focusflow-ambient-btn--on]="ambient.userEnabled()"
        [class.focusflow-ambient-btn--playing]="ambient.isPlaying()"
        (click)="ambient.onHeaderButtonClick()"
        [attr.aria-label]="'header.ambientAria' | translate"
        [attr.title]="'header.ambientTitle' | translate"
      >
        <span class="pi pi-wave-pulse" aria-hidden="true"></span>
      </button>
      <div class="focusflow-language">
        <button
          type="button"
          [class.focusflow-language-active]="currentLanguage() === 'es'"
          (click)="setLanguage('es')"
          [attr.aria-label]="'lang.switchTo' | translate:{lang:'ES'}"
        >
          ES
        </button>
        <button
          type="button"
          [class.focusflow-language-active]="currentLanguage() === 'en'"
          (click)="setLanguage('en')"
          [attr.aria-label]="'lang.switchTo' | translate:{lang:'EN'}"
        >
          EN
        </button>
      </div>
    </div>
  </div>
</header>
